{#
    PDF carousel: renders each page of a PDF with PDF.js and shows the pages in a slick slider.
    Usage: {% partial 'components/pdf-carousel' file='TUdi-SEST-Manual-English.pdf' title='...' %}
#}
{% set pdfUrl = file|media %}
<section class="pdf-carousel" data-pdf="{{ pdfUrl }}" role="region" aria-roledescription="carousel" aria-label="{{ title ?: 'PDF document' }}">
    <div class="pdf-carousel-toolbar">
        <span class="pdf-carousel-counter" aria-live="polite"></span>
        <a class="pdf-carousel-download" href="{{ pdfUrl }}" target="_blank" rel="noopener noreferrer" download>Download PDF</a>
    </div>
    <div class="pdf-carousel-stage">
        <div class="pdf-carousel-loading">Loading document…</div>
        <div class="pdf-carousel-slides"></div>
        <button type="button" class="pdf-carousel-arrow pdf-carousel-prev" aria-label="Previous page">&#8249;</button>
        <button type="button" class="pdf-carousel-arrow pdf-carousel-next" aria-label="Next page">&#8250;</button>
    </div>
</section>

<style>
    .pdf-carousel { margin: 30px 0; }
    .pdf-carousel-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .pdf-carousel-counter { font-weight: 600; }
    .pdf-carousel-stage { position: relative; background: #f4f4f4; border-radius: 6px; padding: 20px 50px; min-height: 200px; }
    .pdf-carousel-loading { text-align: center; padding: 60px 0; }
    .pdf-carousel-slides { visibility: hidden; }
    .pdf-carousel-slides.slick-initialized { visibility: visible; }
    .pdf-carousel-slides .slick-list { overflow: hidden; padding: 70px 0 !important; }
    .pdf-carousel-slides .slick-track { display: flex; align-items: center; }
    /* Pages further from the selected one sit smaller, faded and behind */
    .pdf-carousel-slide { outline: none; padding: 0 8px; position: relative; z-index: 1; opacity: .3; transform: scale(.7); transition: transform .4s ease, opacity .4s ease; cursor: pointer; }
    .pdf-carousel-slide.is-prev { z-index: 2; opacity: .6; transform: translateX(18%) scale(.85); }
    .pdf-carousel-slide.is-next { z-index: 2; opacity: .6; transform: translateX(-18%) scale(.85); }
    .pdf-carousel-slide.slick-current { z-index: 3; opacity: 1; transform: scale(1.3); cursor: default; }
    .pdf-carousel-slide canvas { display: block; width: 100%; height: auto !important; margin: 0 auto; box-shadow: 0 4px 18px rgba(0, 0, 0, .25); background: #fff; }
    .pdf-carousel-slide.slick-current canvas { box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }
    .pdf-carousel-arrow { position: absolute; top: 50%; transform: translateY(-50%); z-index: 5; width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(0, 0, 0, .55); color: #fff; font-size: 28px; line-height: 36px; cursor: pointer; padding: 0; }
    .pdf-carousel-arrow:hover, .pdf-carousel-arrow:focus { background: rgba(0, 0, 0, .8); }
    .pdf-carousel-arrow.slick-disabled { opacity: .3; cursor: default; }
    .pdf-carousel-prev { left: 5px; }
    .pdf-carousel-next { right: 5px; }
    @media (max-width: 767px) {
        .pdf-carousel-stage { padding: 10px 35px; }
        .pdf-carousel-slides .slick-list { padding: 30px 0 !important; }
        .pdf-carousel-slide.slick-current { transform: scale(1.1); }
        .pdf-carousel-arrow { width: 30px; height: 30px; font-size: 22px; line-height: 28px; }
    }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function ($) {
    if (!window.pdfjsLib) { return; }
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    $('.pdf-carousel').each(function () {
        var $root = $(this),
            $slides = $root.find('.pdf-carousel-slides'),
            $counter = $root.find('.pdf-carousel-counter'),
            $loading = $root.find('.pdf-carousel-loading');

        pdfjsLib.getDocument($root.data('pdf')).promise.then(function (pdf) {
            var total = pdf.numPages,
                // Selected page is ~1/3 of the stage scaled up 1.3x, so render at about half the stage width
                width = Math.min($slides.width() || 800, 900) * 0.5,
                pixelRatio = window.devicePixelRatio || 1,
                renders = [];

            for (var i = 1; i <= total; i++) {
                var canvas = document.createElement('canvas'),
                    $slide = $('<div class="pdf-carousel-slide"></div>')
                        .attr('aria-label', 'Page ' + i + ' of ' + total)
                        .append(canvas);
                $slides.append($slide);

                renders.push(pdf.getPage(i).then(function (canvas) {
                    return function (page) {
                        var base = page.getViewport({ scale: 1 }),
                            viewport = page.getViewport({ scale: (width / base.width) * pixelRatio });
                        canvas.width = viewport.width;
                        canvas.height = viewport.height;
                        return page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
                    };
                }(canvas)));
            }

            // Render the first page before showing the slider, the rest keep rendering in the background
            renders[0].then(function () {
                $loading.remove();

                // Mark the neighbours of the selected page so they can sit just behind it
                var mark = function (index) {
                    var $all = $slides.find('.pdf-carousel-slide').removeClass('is-prev is-next');
                    if (index > 0) { $all.eq(index - 1).addClass('is-prev'); }
                    $all.eq(index + 1).addClass('is-next');
                    $counter.text('Page ' + (index + 1) + ' of ' + total);
                };

                $slides.on('init', function () {
                    mark(0);
                }).on('beforeChange', function (e, slick, current, next) {
                    mark(next);
                }).slick({
                    rows: 0,
                    slidesToShow: 3,
                    slidesToScroll: 1,
                    centerMode: true,
                    centerPadding: '0',
                    infinite: false,
                    focusOnSelect: true,
                    speed: 400,
                    dots: false,
                    prevArrow: $root.find('.pdf-carousel-prev'),
                    nextArrow: $root.find('.pdf-carousel-next'),
                    responsive: [{
                        breakpoint: 768,
                        settings: { slidesToShow: 1, centerPadding: '18%' }
                    }]
                });
            });

            Promise.all(renders).then(function () {
                $slides.slick('setPosition');
            });
        }).catch(function () {
            $loading.html('The document could not be displayed. <a href="' + $root.data('pdf') + '" target="_blank" rel="noopener noreferrer">Open the PDF</a>.');
            $root.find('.pdf-carousel-arrow').hide();
        });
    });
})(jQuery);
</script>
